    {time = 00:00:37.900069, text = "the message gets passed around until it goes something like this:"},
    {time = 00:00:39.515459, text = "\"Ya lalipappala, pappappala!\""},
    {time = 00:00:41.361609, text = "Everyone's stuffing their cheeks in the most unsightly manner"},
