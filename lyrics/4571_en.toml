    {time = 00:01:25.900069, text = "People will understandably crowd when you expose a wrapper's contents, alas."},
    {time = 00:01:29.592380, text = "Behind the scenes, someone will secretly pour black rain."},
    {time = 00:01:33.284689, text = "I'm just meeting the majority's demands and selling them what they want."},
    {time = 00:01:36.977000, text = "You do that, too? Of course I also do that."},
    {time = 00:01:39.977000, text = "For example, if that XXXX's XXXXX turns out"},
    {time = 00:01:47.361609, text = "to actually be XXXX, then"},
    {time = 00:01:50.592380, text = "that's already XXXX, and XXX is"},
    {time = 00:01:54.515460, text = "XXXXX!!"},
    {time = 00:02:10.207760, text = "What would you fill into the grooves eaten out by worms?"},
    {time = 00:02:13.900069, text = "I'll make an exception and let you grab my tail grown out of guilt."},
    {time = 00:02:17.592379, text = "I won't look at \"that\" when I can, but I want to see \"that\" when I can't."},
