    {time = 00:00:45.284689, text = "They'd slowly become addicted to sobbing"},
    {time = 00:00:47.130839, text = "and get swayed by some rotten heresy."},
    {time = 00:00:48.976999, text = "I'll lick some sweet, sweet chocolate whether it's real or not, alas."},
    {time = 00:00:52.669299, text = "Whatever the truth may be, we're fed delicious food full of additives."},
    {time = 00:00:56.361609, text = "Platitudes ring too hollow; this juicy nectar is more real to me."},
    {time = 00:01:00.053919, text = "You think so, too? Of course I also think so."},
    {time = 00:01:03.053919, text = "How simple-minded."},
    {time = 00:01:05.592380, text = ""},
    {time = 00:01:10.207759, text = "What I'm about to say is a secret;"},
    {time = 00:01:11.130840, text = "but that extremely popular idol, that handsome scholar,"},
