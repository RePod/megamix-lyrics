    {time = 00:00:32.678280, text = "yet they leave them in arm’s reach."},
    {time = 00:00:36.535420, text = "I get all weird and find the tension so fun. Silently, I reach out."},
    {time = 00:00:44.892569, text = ""},
    {time = 00:00:45.535420, text = "Crumbly"},
    {time = 00:00:46.392569, text = "Crumbly, crumbly."},
    {time = 00:00:48.106850, text = "Crumbly. It’s especially fun to break your things."},
    {time = 00:00:53.249710, text = "Crumbly, crumbly."},
    {time = 00:00:54.963999, text = "Crumbly. Your valuables are even more fun to break."},
    {time = 00:01:00.106850, text = "Things are all in pieces. Close, open..."},
    {time = 00:01:03.535420, text = "I can’t have fun if it’s just once"},
    {time = 00:01:06.963999, text = "so I fix it, break it, fix it, and break it again."},
    {time = 00:01:10.392570, text = "You, too, forget what it originally looked like."},
    {time = 00:01:17.249709, text = ""},
    {time = 00:01:29.035420, text = "I’ve even demolished things crammed full of memories:"},
    {time = 00:01:32.678280, text = "Stuffed toys, plastic models, pianos, letters..."},
    {time = 00:01:35.892570, text = "I’ve even carefully demolished things full of feelings:"},
    {time = 00:01:39.535420, text = "Musical instruments, paintings, pottery, sculptures..."},
    {time = 00:01:42.963999, text = "When people put their hopes and feelings in things,"},
    {time = 00:01:46.392570, text = "Their souls cross over and dwell in them, since they’ll last forever."},
    {time = 00:01:49.821139, text = "The more precious things exist, the more souls there are."},
    {time = 00:01:53.678280, text = "They breathe fragilely,"},
    {time = 00:01:57.535420, text = "enjoy life, and are then silently killed."},
    {time = 00:02:01.821139, text = ""},
    {time = 00:02:02.678280, text = "Crumbly,"},
    {time = 00:02:03.535420, text = "Crumbly, crumbly."},
    {time = 00:02:05.249709, text = "Crumbly. I want to keep breaking your soul."},
    {time = 00:02:10.392570, text = "Crumbly, crumbly."},
    {time = 00:02:12.106850, text = "Crumbly. I want to erase your living soul."},
    {time = 00:02:17.249709, text = "In pieces, in pieces, things end up in pieces"},
    {time = 00:02:20.678280, text = "and the moment your soul vanishes..."},
    {time = 00:02:24.106850, text = "I’ll fix it, I’ll break it, I’ll fix it and break it."},
    {time = 00:02:27.535419, text = "I laugh and you cry."},
    {time = 00:02:30.963999, text = "La la la la la..."},
    {time = 00:02:44.571619, text = ""},
    {time = 00:02:45.535899, text = "Still,"},
    {time = 00:02:46.393049, text = "Crumbly, crumbly."},
    {time = 00:02:48.107329, text = "Crumbly. You followed along. You love me."},
    {time = 00:02:53.250190, text = "Crumbly, crumbly."},
    {time = 00:02:54.964470, text = "Crumbly. I love you, who also loves me."},
    {time = 00:03:00.106850, text = "Crumbly, crumbly."},
    {time = 00:03:01.821140, text = "Crumbly. Your soul is possessing me now."},
    {time = 00:03:06.963999, text = "Crumbly, crumbly."},
    {time = 00:03:08.678280, text = "Crumbly. My soul is possessing you now."},
    {time = 00:03:13.821140, text = "Crumbly, crumbly."},
    {time = 00:03:15.535419, text = "Crumbly. I crumble up your precious thing."},
