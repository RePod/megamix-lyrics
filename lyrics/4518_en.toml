lyrics = [
    {time = 00:00:01.821140, text = "Why is it so fun to destroy things? Ole!"},
    {time = 00:00:05.249710, text = ""},
    {time = 00:00:11.892569, text = "Since I became aware, I’ve destroyed a whole bunch of things:"},
