# Someday in that Summer (2022 ver.)

lyrics = [
    {time = 00:00:02.082000, text = "Let’s go and meet that summer, which happened long, long ago"},
    {time = 00:00:07.992000, text = "I wonder how difficult it is to high-five while wearing the same smile as that day?"},
    {time = 00:00:14.562000, text = "How many times did summer occur by now? How many summers has it been?"},
    {time = 00:00:19.992000, text = "Now at last, I reach my hand out for that promise"},
