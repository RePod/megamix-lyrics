# [un]INSOMNIA Feat. Yuzuki Yukari

lyrics = [
    {time = 00:00:37.949939, text = "The moon is shining its light"},
    {time = 00:00:43.111229, text = "upon the abandoned music stand."},
    {time = 00:00:48.272520, text = "Please, let me hear a song no one"},
    {time = 00:00:55.369300, text = "should be able to sing."},
    {time = 00:00:58.272520, text = "(Abolish) Everything..."},
    {time = 00:01:00.530589, text = "“Are the seats empty because people are busy with other things?”"},
    {time = 00:01:03.433810, text = "(Abolish) Everything..."},
    {time = 00:01:05.691879, text = "“Up, down, left, right, which way am I supposed to face?”"},
    {time = 00:01:08.595100, text = "(Abolish) Everything..."},
    {time = 00:01:11.175749, text = "“What time is the clock pointing at?”"},
    {time = 00:01:13.756389, text = "(Abolish) Everything..."},
    {time = 00:01:16.014459, text = "“Am I all alone here, at the shore where there’s no other soul?”"},
    {time = 00:01:19.464169, text = "I still alone in darkness. So...Please tell me. What do I sing?"},
    {time = 00:01:28.591220, text = "Right now, I’m placing my hand on my chest and listening closely,"},
    {time = 00:01:35.364999, text = "waiting for you."},
    {time = 00:01:38.913390, text = "I still can’t forget; I don’t want to forget—"},
    {time = 00:01:45.687579, text = "the reason why I exist."},
    {time = 00:01:50.203710, text = "The wind is carrying with it"},
    {time = 00:01:55.364999, text = "completely blank music scores."},
    {time = 00:02:00.526290, text = "Please, play for me the notes no one should be"},
    {time = 00:02:07.623069, text = "able to take away from me."},
    {time = 00:02:10.526289, text = "(Loss) Anything..."},
    {time = 00:02:12.945650, text = "“Is this voice simply a means to an end, for the next stage?”"},
    {time = 00:02:15.687579, text = "(Loss) Anything..."},
    {time = 00:02:18.268229, text = "“Are all the listeners going through a change of generations?”"},
    {time = 00:02:20.848870, text = "(Loss) Anything..."},
    {time = 00:02:23.429519, text = "“How long are the clock hands going to be stuck in this position?”"},
    {time = 00:02:26.010169, text = "(Loss) Anything..."},
    {time = 00:02:28.268229, text = "“Is this an invitation to a concert where there’s no other soul?”"},
    {time = 00:02:31.713130, text = "I still believe you will return. So...Please tell me. Why do I sing ?"},
    {time = 00:02:40.815480, text = "Right now, I’m mustering all of my voice and expanding my vision"},
    {time = 00:02:47.589769, text = "as I search for you."},
    {time = 00:02:51.138159, text = "I still can’t let go; I don’t want to let go of you"},
    {time = 00:02:57.912350, text = "within my memory."},
    {time = 00:03:00.492999, text = "My wishes are traveling far away, farther than the moon,"},
    {time = 00:03:05.654290, text = "my words are filled with loneliness. Indeed, they’re a deadly poison."},
    {time = 00:03:10.815580, text = "Farewell, the night. Farewell, the morning."},
    {time = 00:03:15.976869, text = "I can no longer go back"},
    {time = 00:03:19.847839, text = "to my original form."},
    {time = 00:03:23.073640, text = "“A shallow trick that’s served its purpose.”"},
    {time = 00:03:28.234929, text = "“Without a user, the fate is as good as death.”"},
    {time = 00:03:33.396219, text = "“A soul discarded after it’s done its job.”"},
    {time = 00:03:38.557510, text = "“That is a self of mine much resembling myself.”"},
    {time = 00:03:43.799450, text = ""},
    {time = 00:03:45.331709, text = "Right now, I’m singing at the top of my voice, ear-splittingly loud,"},
    {time = 00:03:52.105899, text = "in my hatred for you."},
    {time = 00:03:55.654290, text = "I don’t want to sleep yet; I’m never going to sleep"},
    {time = 00:04:02.428480, text = "here at the bottom of my nightmares."},
    {time = 00:04:05.009129, text = "There’s no end to this dizziness; it’s deeper than the sea."},
    {time = 00:04:10.170420, text = "It’s like the pit of hell. Yes, it’s total depravity."},
    {time = 00:04:15.331709, text = "Farewell, my voice. Farewell, my songs."},
    {time = 00:04:20.492999, text = "I can no longer return"},
    {time = 00:04:24.363960, text = "to the world where I’m supposed to be."},
    {time = 00:04:31.944610, text = ""},
]
