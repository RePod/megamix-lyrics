    {time = 00:01:19.196470, text = ""},
    {time = 00:01:28.496470, text = "When I woke up in bed, I hear the echoing sound of a clock's hands."},
    {time = 00:01:34.646469, text = "What time is it?"},
    {time = 00:01:35.996470, text = ""},
    {time = 00:01:38.096469, text = "The hands of the clock point to a little past midnight on August 15."},
    {time = 00:01:44.246470, text = "I remember the annoying noises of the cicadas."},
    {time = 00:01:47.096469, text = "But wow, it's kinda mysterious."},
    {time = 00:01:51.146469, text = "I remember the dream I had yesterday in the same park."},
    {time = 00:01:56.996470, text = "\"I should go home for today.\" When I was on my way,"},
    {time = 00:02:02.096469, text = "The people around me were all looking up with their mouths gaping."},
    {time = 00:02:06.596469, text = "A falling metal pole"},
    {time = 00:02:08.696470, text = "Pierced through you."},
    {time = 00:02:11.396469, text = "A tearing shriek and the sound of wind chimes echo through the trees."},
    {time = 00:02:16.196470, text = "The heat haze was sneering at me,"},
    {time = 00:02:18.296469, text = "Reminding me that it wasn't a joke."},
    {time = 00:02:20.996469, text = "Through my darkening eyes,"},
    {time = 00:02:23.396469, text = "I thought I saw you smile."},
    {time = 00:02:26.096470, text = ""},
    {time = 00:02:44.996469, text = "The sneering heat haze plunders away one darkened world after another."},
    {time = 00:02:49.796469, text = "It's been repeating for tens of years."},
    {time = 00:02:51.896469, text = "You probably have noticed by now."},
    {time = 00:02:54.596470, text = "This kind of frequently told story"},
    {time = 00:02:56.696470, text = "Has only one ending,"},
    {time = 00:02:59.396469, text = "But it can be found beyond those repeating summer days."},
    {time = 00:03:02.996469, text = ""},
    {time = 00:03:04.196470, text = "When I pushed you aside and jumped in,"},
    {time = 00:03:06.296469, text = "The truck slammed into me."},
    {time = 00:03:08.996469, text = "The color of my blood reflected off your eyes and your robotic body."},
    {time = 00:03:13.796469, text = "The seemingly annoyed heat haze was laughing,"},
    {time = 00:03:15.896469, text = "As though saying \"Take that!\""},
    {time = 00:03:18.596470, text = "It's quite a regular summer day for me."},
    {time = 00:03:20.996469, text = "But something has come to an end this time."},
    {time = 00:03:23.996469, text = ""},
    {time = 00:03:33.296469, text = "Awakening on August 14 in a bed,"},
    {time = 00:03:39.446470, text = "A girl"},
    {time = 00:03:40.796469, text = ""},
    {time = 00:03:42.896469, text = "Hugging her cat alone, said,"},
    {time = 00:03:44.696470, text = "\"It didn't work again.\""},
