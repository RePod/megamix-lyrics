lyrics = [
    {time = 00:00:21.296469, text = "It happened at around 12:30 pm on August 15."},
    {time = 00:00:27.446470, text = "The weather was nice."},
    {time = 00:00:28.796469, text = ""},
    {time = 00:00:30.896470, text = "Showered in sunlight bright enough to make me feel ill,"},
    {time = 00:00:37.046469, text = "I, having nothing to do, was chattering with you."},
    {time = 00:00:39.896470, text = "\"But I think I kinda hate summer.\" While caressing a cat,"},
