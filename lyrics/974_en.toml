    {time = 00:01:58, text = "My dirtily turbid desires - I cover them up and hide my guilt"},
    {time = 00:02:01.760000, text = "The innocent emotions, so much that I clean and dispose of them"},
    {time = 00:02:05.519999, text = "For what grounds does \"pure\" and \"impure\" become the labels I brandish?"},
    {time = 00:02:08.289999, text = "Please stop your humble act and give me a solution, oh Sister!"},
    {time = 00:02:11.169999, text = "Please, for once, overlook this with fairness, even if I kick a pebble"},
    {time = 00:02:15.229999, text = ""},
    {time = 00:02:37.539999, text = "A defective toy of love, even the colors weren't painted"},
