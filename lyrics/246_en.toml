    {time = 00:02:00.049999, text = "An embarrassment-hiding rebellious phase"},
    {time = 00:02:03.959999, text = "You laugh innocently, not showing it"},
    {time = 00:02:08.304000, text = "We'll always be like this, won't we?"},
