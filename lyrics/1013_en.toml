# Someday in that Summer

lyrics = [
    {time = 00:00:02.082000, text = "I swam in the calmed sky of the dream that wanted to disappear"},
    {time = 00:00:07.992000, text = "And flashed back to that day again with the same color of regret"},
    {time = 00:00:14.562000, text = "How many more summers to come? How many summers does this make?"},
    {time = 00:00:19.992000, text = "That promise of someday is drifting further away"},
    {time = 00:00:26.942000, text = ""},
    {time = 00:00:38.482000, text = "I've always wanted to sneak away"},
    {time = 00:00:43.022000, text = "From the ordinary that I don't understand"},
    {time = 00:00:45.852000, text = "But it was simpler than I thought, you see"},
    {time = 00:00:50.912000, text = "It won't mean anything if I can't convey it"},
    {time = 00:00:53.372000, text = "I won't be able to do anything only by imagination"},
    {time = 00:00:56.372000, text = "I won't reach if I don't start walking"},
    {time = 00:00:59.342000, text = "There's no time for worrying"},
    {time = 00:01:02.922000, text = "We will definitely remember"},
    {time = 00:01:05.362000, text = "Our hearts fired up every time we recall"},
    {time = 00:01:08.852000, text = "That kind of today opens its curtains"},
    {time = 00:01:11.372000, text = "Jump in, there, ready, go!"},
    {time = 00:01:15.452000, text = "What have I sketched. Where have I stood."},
    {time = 00:01:18.482000, text = "Who have I thought of. Was it yesterday?"},
    {time = 00:01:21.452000, text = "What do I like, where do I aim for,"},
    {time = 00:01:24.472000, text = "Who do I want to meet? The me of today"},
	{time = 00:01:28.172000, text = ""},
    {time = 00:01:38.292000, text = "I searched thinking there might be something"},
    {time = 00:01:41.522000, text = "Even though I knew it wasn't even supposed to be in this room"},
    {time = 00:01:45.802000, text = "But I was so immersed in it"},
    {time = 00:01:48.762000, text = "Are you all right with that, asked the sun persistently"},
    {time = 00:01:58.012000, text = "So I thought maybe I should just go with it"},
	{time = 00:02:01.342000, text = ""},
    {time = 00:02:02.872000, text = "You won't know if you don't see"},
    {time = 00:02:05.262000, text = "Not knowing would be the same as it not existing"},
    {time = 00:02:08.352000, text = "If it's a \"someday\" you don't know the arrival of"},
    {time = 00:02:11.352000, text = "You should welcome it starting today, and then"},
    {time = 00:02:14.922000, text = "We will definitely remember"},
    {time = 00:02:17.352000, text = "Our feet able to step forward every time we recall"},
    {time = 00:02:20.452000, text = "Failure is not scary at all"},
    {time = 00:02:23.352000, text = "What's scary is to not leave anything behind"},
    {time = 00:02:27.472000, text = "What have you touched. Why have you laughed."},
    {time = 00:02:30.492000, text = "When have you imagined. Was it today?"},
    {time = 00:02:33.442000, text = "What do you yearn for, why do you want to know,"},
    {time = 00:02:36.482000, text = "When will you come to remember? About today"},
	{time = 00:02:40.012000, text = ""},
    {time = 00:02:50.092000, text = "The sinking orange ray engraved today once again"},
    {time = 00:02:55.982000, text = "The memories will prove that I am who I am"},
    {time = 00:03:02.562000, text = "How many more summers to come? How many summers does this make?"},
    {time = 00:03:07.892000, text = "Well now, let's fulfill the promise of that someday"},
    {time = 00:03:14.882000, text = "We will remember someday"},
    {time = 00:03:17.882000, text = "We will definitely remember"},
    {time = 00:03:20.352000, text = "Our hearts fired up every time we recall"},
    {time = 00:03:23.852000, text = "That kind of today opens its curtains"},
    {time = 00:03:26.372000, text = "Jump in, there, ready, go!"},
    {time = 00:03:30.442000, text = "What have I sketched. Where have I stood."},
    {time = 00:03:33.462000, text = "Who have I thought of. Was it yesterday?"},
    {time = 00:03:36.442000, text = "What do I like, where do I aim for,"},
    {time = 00:03:39.462000, text = "Who do I want to meet? The me of today"},
    {time = 00:03:42.442000, text = "What have you touched. Why have you laughed."},
    {time = 00:03:45.472000, text = "When have you imagined. Was it today?"},
    {time = 00:03:48.442000, text = "What do you yearn for, why do you want to know,"},
    {time = 00:03:51.472000, text = "When will you come to remember? About today"},
