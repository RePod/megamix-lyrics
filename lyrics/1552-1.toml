# Happy Synthesizer (Len & 96Neko)

lyrics = [
    {time = 00:00:03.705000, text = "HAPPY SYNTHESIZER  kimi no  mune no oku made"},
    {time = 00:00:07.595000, text = "todoku you na MELODY  kanaderu yo"},
    {time = 00:00:11.645000, text = ""},
    {time = 00:00:26.755000, text = "hakanaku chitta awai kataomoi"},
    {time = 00:00:30.535000, text = "waraibanashi da ne  ima to nareba"},
    {time = 00:00:34.305000, text = "miru mono subete  kagayaite mieta"},
    {time = 00:00:38.085000, text = "ano hibi ga kirei ni  waratteru yo"},
    {time = 00:00:41.885000, text = "gaman suru koto dake  oboenakya ikenai no?"},
    {time = 00:00:45.665000, text = "\"otona ni natte choudai ne?\"  naranakute ii yo"},
    {time = 00:00:49.435000, text = "shiranai koto bakari  shiranai nante ienakute"},
    {time = 00:00:53.215000, text = "\"taihen oniai de\" uso tsuite gomen ne"},
    {time = 00:00:56.985000, text = "HAPPY SYNTHESIZER  kimi no  mune no oku made"},
    {time = 00:01:00.515000, text = "todoku you na MELODY  kanaderu yo"},
    {time = 00:01:04.555000, text = "tsumaranai \"tatemae\" ya  ya na koto zenbu"},
    {time = 00:01:08.095000, text = "keshite ageru kara  kono oto de"},
    {time = 00:01:12.295000, text = "nan no torie mo nai  boku ni tadahitotsu"},
    {time = 00:01:16.095000, text = "sukoshi da kedo  dekiru koto"},
    {time = 00:01:19.875000, text = "kokoro odoraseru  kazaranai  kotoba"},
    {time = 00:01:23.695000, text = "denshion de tsutaeru yo"},
	{time = 00:01:27.225000, text = ""},
    {time = 00:01:30.995000, text = "suki ni naru koto  rikutsu nanka janakute"},
    {time = 00:01:34.795000, text = "\"kojitsuke\" nante  iranain janai?"},
    {time = 00:01:38.565000, text = "jidai no sei to  akirametara soko made"},
    {time = 00:01:42.355000, text = "fumidasanakucha  nanimo hajimaranai"},
    {time = 00:01:46.135000, text = "\"gomen ne yoru osoku  neru tokoro datta desho?\""},
    {time = 00:01:49.915000, text = "\"zenzen WELCOME! daisuki LEN-kun  ima kara iku ne! FOO!\""},
    {time = 00:01:53.695000, text = "kokoro no uragawa o kusugurareteru you na"},
    {time = 00:01:57.465000, text = "hikareau futari ni  shiawase na oto o"},
    {time = 00:02:01.245000, text = "HAPPY SYNTHESIZER  hora ne  tanoshiku naru yo"},
    {time = 00:02:04.765000, text = "namida nuguu MELODY  kanaderu yo"},
    {time = 00:02:08.805000, text = "tsuyogaranakuta tte iin janai?  betsu ni"},
    {time = 00:02:12.345000, text = "jibun ni sunao ni nareba ii"},
    {time = 00:02:16.565000, text = "nan no torie mo nai  boku ni tadahitotsu"},
    {time = 00:02:20.325000, text = "sukoshi da kedo  dekiru koto"},
    {time = 00:02:24.145000, text = "chotto tereru you na  tanjun na kimochi"},
