# Happy Synthesizer (Len & 96Neko)

lyrics = [
    {time = 00:00:03.705000, text = "Happy Synthesizer I'll play you a melody"},
    {time = 00:00:07.595000, text = "That will reach into your heart"},
    {time = 00:00:11.645000, text = ""},
    {time = 00:00:26.755000, text = "Fleeting one-sided love that is quickly lost"},
    {time = 00:00:30.535000, text = "Is a funny story now that I think about it"},
    {time = 00:00:34.305000, text = "Everything I saw looked like it sparkled"},
    {time = 00:00:38.085000, text = "Those days were smiling beautifully"},
    {time = 00:00:41.885000, text = "Is all I have to remember grinning and bearing it?"},
    {time = 00:00:45.665000, text = "\"Will you become an adult?\" I don't have to"},
    {time = 00:00:49.435000, text = "So much I didn't know, but I couldn't admit it"},
    {time = 00:00:53.215000, text = "\"We're just right for each other.\" I'm sorry, it was a lie"},
    {time = 00:00:56.985000, text = "Happy Synthesizer I'll play you a melody"},
    {time = 00:01:00.515000, text = "That will reach into your heart"},
    {time = 00:01:04.555000, text = "Pointless \"facades\" and things you dislike"},
    {time = 00:01:08.095000, text = "I'll erase them all for you with this sound"},
    {time = 00:01:12.295000, text = "I'm not much good for anything, bit there's just one thing"},
    {time = 00:01:16.095000, text = "I can do even though it's not much"},
    {time = 00:01:19.875000, text = "I'll convey plain but rousing words"},
    {time = 00:01:23.695000, text = "Through electric sounds"},
	{time = 00:01:27.225000, text = ""},
    {time = 00:01:30.995000, text = "Falling in love with someone doesn't need reasons"},
    {time = 00:01:34.795000, text = "No need for \"twisting the truth\", right?"},
    {time = 00:01:38.565000, text = "Blaming it on the era and giving up, that's as far as you'll go"},
    {time = 00:01:42.355000, text = "Nothing will start, until you step forward"},
    {time = 00:01:46.135000, text = "\"I'm sorry to call you late at night... you were going to bed, right?\""},
    {time = 00:01:49.915000, text = "\"Totally welcome! I love you Len, I'm on my way! Foo!\""},
    {time = 00:01:53.695000, text = "Like they're being tickled at the back of their hearts"},
    {time = 00:01:57.465000, text = "A happy sound to an attracted couple"},
    {time = 00:02:01.245000, text = "Happy Synthesizer, see, you'll be pleased"},
    {time = 00:02:04.765000, text = "I'll play you this melody that will wipe away tears"},
    {time = 00:02:08.805000, text = "Do you have to pretend you're stronger than you truly are? Not really"},
    {time = 00:02:12.345000, text = "Embrace the real you inside"},
    {time = 00:02:16.565000, text = "I'm not much good for anything, but there's just one thing"},
